name: Update Nick's Stock Desk

on:
  # The schedule is New York market time, Monday to Friday. With features.twice_daily_schedule
  # on (the default), the guard keeps 10:15 ET (incremental prices) and 18:30 ET (the full run)
  # and skips the other hourly crons. Turn the switch off and 10:15 through 17:15 ET run again.
  # Cron is UTC only, so these list the UTC times for both EDT (UTC-4) and EST (UTC-5).
  # The first step (watchdog.py guard) lets through only the cron that lands on a kept slot.
  schedule:
    # Hourly: 14-21 UTC in EDT, 15-22 UTC in EST.
    - cron: "15 14-22 * * 1-5"
    # Full run: 22:30 UTC in EDT, 23:30 UTC in EST.
    - cron: "30 22,23 * * 1-5"
  # The crons above stay as the main schedule. The keeper workflow (and the cron watchdog) fill in a slot GitHub skipped.
  workflow_dispatch:
    inputs:
      mode:
        description: "full (default, same as before) or hourly"
        required: false
        default: "full"
        type: choice
        options: ["full", "hourly"]
      reason:
        description: "Set to watchdog, keeper, or keeper_retry by those workflows. Leave blank for a manual run."
        required: false
        default: ""
      ownership_full:
        description: "One-time: refresh 13F and insider data for every name in the universe. Default stays the usual 60-name slice. A chunk stops in time to finish the 120-minute job and starts the next run if names are still waiting."
        required: false
        default: false
        type: boolean
      ownership_run:
        description: "Leave at 0. A chained ownership_full run sets the next number itself."
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: nick-stock-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      ownership_chain: ${{ steps.desk.outputs.ownership_chain }}
    # The paper test is saved at the end of the 18:30 ET full run, after the backtest.
    # A 60-minute cap was cancelling that run inside the backtest, so fills never saved.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Scheduled runs: skip unless this cron is a New York-time slot (the other DST twin stops here).
      # Scheduled and watchdog runs: a late cron and a make-up for the same slot collapse into one.
      # Manual runs and the keeper's single retry of a failed slot (keeper_retry) are never skipped.
      # If the run list cannot be read, the duplicate check lets it run.
      - name: Keep to New York slots and skip duplicates
        id: guard
        if: github.event_name == 'schedule' || inputs.reason == 'watchdog' || inputs.reason == 'keeper'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 watchdog.py guard
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run the tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          python tests/test_net.py
          python tests/test_scoring.py
          python tests/test_fundamentals.py
          python tests/test_eps_fill.py
          python tests/test_universe.py
          python tests/test_job.py
          python tests/test_setups.py
          python tests/test_qullamaggie_marios.py
          python tests/test_episodic_pivot.py
          python tests/test_gap_up.py
          python tests/test_sector_rotation.py
          python tests/test_watchdog.py
          python tests/test_keeper.py
          python tests/test_chart_viewer.py
          python tests/test_chart_viewer_weekly.py
          python tests/test_chart_viewer_dense.py
          python tests/test_light_mode.py
          python tests/test_vcp_green_tag.py
          python tests/test_split_tech_fund.py
          python tests/test_ma_colors.py
          python tests/test_trading_floor.py
          python tests/test_trading_floor_paper.py
          python tests/test_incremental_prices.py
          python tests/test_twice_daily_universe.py
          python tests/test_slow_refresh.py
          python tests/test_fast_backfill.py
          python tests/test_profiles.py
          python tests/test_year_rollover.py
          python tests/test_market_news_mood.py
          python tests/test_market_news_causes.py
          python tests/test_market_news_news_calendar.py
          python tests/test_market_news_learning.py
          python tests/test_market_news_brief.py
          python tests/test_market_news_watch.py
          python tests/test_market_news_tips.py
          python tests/test_market_news_story.py
      - name: Update the desk
        id: desk
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          # Commit the cache as each slow source finishes. A timeout used to drop the whole run, including prices already downloaded.
          DESK_CHECKPOINT: "1"
          DESK_OWNERSHIP_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.ownership_full || false }}
          DESK_OWNERSHIP_RUN: ${{ inputs.ownership_run || 0 }}
        run: |
          set -e
          git config user.name "stock-desk-bot"
          git config user.email "stock-desk-bot@users.noreply.github.com"
          # A manual run is full, as before. A watchdog or keeper make-up uses the mode of the slot it replaces.
          # A scheduled run uses the mode of its New York slot (the 18:30 ET slot is the full run).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ownership_full }}" = "true" ]; then
            export DESK_OWNERSHIP_FULL=1
          else
            export DESK_OWNERSHIP_FULL=0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "hourly" ]; then
            python stock_desk.py --hourly
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.guard.outputs.mode }}" = "full" ]; then
            python stock_desk.py --full
          else
            python stock_desk.py --hourly
          fi
          python3 -c "import stock_desk as desk; print(desk.emit_ownership_status_output(desk.paths()[1]))"
      # Nick 360 reads this one saved desk file instead of every five-year chart, so it opens on a phone.
      # Built from the files this run just wrote, with the same engine the page runs. No network.
      # If it fails, the price update still saves and the page says how old the desk file is.
      - name: Save the Nick 360 desk file
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node nick360_build.js
      - name: Save the new numbers
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "stock-desk-bot"
          git config user.email "stock-desk-bot@users.noreply.github.com"
          git add data cache
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update desk data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  # Continue a one-time 13F/insider fill if this run stopped to stay inside 120 minutes.
  # The update job has already saved progress. This starts the next full run on the
  # same branch with ownership_full still on. Regular scheduled runs never set that input.
  ownership_chain:
    needs: update
    if: always() && github.event_name == 'workflow_dispatch' && inputs.ownership_full == true && needs.update.result == 'success' && needs.update.outputs.ownership_chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            watchdog.py
          sparse-checkout-cone-mode: false
      - name: Start the next 13F chunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_OWNERSHIP_RUN: ${{ inputs.ownership_run || 0 }}
        run: python3 watchdog.py chain-ownership

  # Second way in for the keeper: if no keeper is queued or running (chain broken), start one.
  # Does nothing when one is live or features.self_heal_keeper is off. Reads no market data.
  keeper:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config.json
            watchdog.py
          sparse-checkout-cone-mode: false
      - name: Start a keeper if none is live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 watchdog.py ensure-keeper
