name: Update Nick's Stock Desk

on:
  # The schedule is New York market time, Monday to Friday: hourly at 10:15 .. 17:15 ET
  # (prices refresh, slow sources stay on today's cache) and the full run at 18:30 ET
  # (fundamentals, 13F, insiders, option chains). Cron is UTC only, so these list the UTC
  # times for both EDT (UTC-4) and EST (UTC-5). The first step (watchdog.py guard) lets
  # through only the cron that lands on a New York slot, so there is still one run per slot.
  schedule:
    # Hourly: 14-21 UTC in EDT, 15-22 UTC in EST.
    - cron: "15 14-22 * * 1-5"
    # Full run: 22:30 UTC in EDT, 23:30 UTC in EST.
    - cron: "30 22,23 * * 1-5"
  # The crons above stay as the main schedule. The watchdog workflow only fills in a slot GitHub skipped.
  workflow_dispatch:
    inputs:
      mode:
        description: "full (default, same as before) or hourly"
        required: false
        default: "full"
        type: choice
        options: ["full", "hourly"]
      reason:
        description: "Set to watchdog by the watchdog workflow. Leave blank for a manual run."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: nick-stock-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Scheduled runs: skip unless this cron is a New York-time slot (the other DST twin stops here).
      # Scheduled and watchdog runs: a late cron and a make-up for the same slot collapse into one.
      # Manual runs are never skipped. If the run list cannot be read, the duplicate check lets it run.
      - name: Keep to New York slots and skip duplicates
        id: guard
        if: github.event_name == 'schedule' || inputs.reason == 'watchdog'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 watchdog.py guard
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run the tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          python tests/test_net.py
          python tests/test_scoring.py
          python tests/test_fundamentals.py
          python tests/test_universe.py
          python tests/test_job.py
          python tests/test_setups.py
          python tests/test_qullamaggie_marios.py
          python tests/test_sector_rotation.py
          python tests/test_watchdog.py
      - name: Update the desk
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          # A manual run is full, as before. A watchdog make-up uses the mode of the slot it replaces.
          # A scheduled run uses the mode of its New York slot (the 18:30 ET slot is the full run).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "hourly" ]; then
            python stock_desk.py --hourly
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.guard.outputs.mode }}" = "full" ]; then
            python stock_desk.py --full
          else
            python stock_desk.py --hourly
          fi
      - name: Save the new numbers
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "stock-desk-bot"
          git config user.email "stock-desk-bot@users.noreply.github.com"
          git add data cache
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update desk data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
